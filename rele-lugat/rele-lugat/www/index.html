<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>Rele Lug'at</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Birinchi ishga tushirish: ism so'raladi -->
<div id="onboard" class="onboard hidden">
  <div class="onboard-card">
    <img src="logo.svg" alt="" class="onboard-logo">
    <h1>Rele Lug'at</h1>
    <p class="muted">Releli himoya fanini o'yin bilan o'rganing</p>
    <label class="field">
      <span>Ismingiz</span>
      <input id="onboard-name" type="text" maxlength="24" placeholder="Masalan: Dilshod" autocomplete="off">
    </label>
    <p class="tiny muted">Boshqa hech qanday ma'lumot yig'ilmaydi. Hammasi faqat shu telefonda saqlanadi.</p>
    <button id="onboard-go" class="btn btn-primary btn-lg">Boshlash</button>
  </div>
</div>

<header class="appbar">
  <div class="appbar-left">
    <img src="logo.svg" alt="" class="appbar-logo">
    <div>
      <div class="appbar-title" id="bar-title">Rele Lug'at</div>
      <div class="appbar-sub" id="bar-sub">Releli himoya</div>
    </div>
  </div>
  <div class="appbar-right">
    <div class="streak-chip" id="streak-chip" title="Kunlik streak">🔥 <span id="streak-n">0</span></div>
    <button class="icon-btn" id="theme-btn" aria-label="Tungi/kunduzgi rejim">🌙</button>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="tabbar">
  <button class="tab" data-tab="home"><span class="ti">🏠</span><span>Bosh</span></button>
  <button class="tab" data-tab="glossary"><span class="ti">📖</span><span>Lug'at</span></button>
  <button class="tab" data-tab="games"><span class="ti">🎮</span><span>O'yinlar</span></button>
  <button class="tab" data-tab="calc"><span class="ti">🧮</span><span>Hisob</span></button>
  <button class="tab" data-tab="profile"><span class="ti">👤</span><span>Profil</span></button>
</nav>

<div id="toast" class="toast"></div>
<canvas id="confetti" class="confetti"></canvas>

<!-- Kontent (build bosqichisiz, file:// da ham ishlaydi) -->
<script src="data/lectures.js"></script>
<script src="data/glossary.js"></script>
<script src="data/quizzes.js"></script>
<script src="data/circuits.js"></script>
<script src="data/scenarios.js"></script>
<script src="data/calculators.js"></script>
<script src="data/relays.js"></script>

<!-- Yadro -->
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/svg.js"></script>

<!-- Bo'limlar -->
<script src="js/view-home.js"></script>
<script src="js/view-glossary.js"></script>
<script src="js/view-flashcards.js"></script>
<script src="js/view-quiz.js"></script>
<script src="js/view-circuit.js"></script>
<script src="js/view-scenario.js"></script>
<script src="js/view-logic.js"></script>
<script src="js/view-relay.js"></script>
<script src="js/view-calc.js"></script>
<script src="js/view-games.js"></script>
<script src="js/view-profile.js"></script>

<script src="js/app.js"></script>
</body>
</html>
