name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Loyiha repo ildizida emas, ichki papkada turadi.
    defaults:
      run:
        working-directory: rele-lugat/rele-lugat

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Capacitor 7 ning Android Gradle plagini Java 21 ni talab qiladi.
      - name: Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Bog'liqliklarni o'rnatish
        run: npm install

      # v2 — Vite + React. `webDir: dist` shu qadamda hosil bo'ladi,
      # shuning uchun `cap add/sync` dan OLDIN turishi shart.
      - name: Web ilovani yig'ish (Vite + React)
        run: npm run build

      - name: Android platformasini qo'shish
        run: npx cap add android

      - name: Ikonka va splash (xato bersa o'tkazib yuboriladi)
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Web fayllarni ko'chirish
        run: npx cap sync android

      - name: Debug APK yig'ish
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # `path` repo ILDIZIGA nisbatan beriladi — `working-directory` unga
      # ta'sir qilmaydi (u faqat `run` qadamlariga tegishli).
      - name: APK ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: rele-lugat-apk
          path: rele-lugat/rele-lugat/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
